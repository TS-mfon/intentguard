name: IntentGuard hosted story verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-story-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify hosted story, media and recovery
        env:
          STORY_BASE_URL: https://intentguard-tapeout.vercel.app
        run: pnpm exec tsx scripts/story-browser.ts
      - name: Preserve hosted browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-story-browser-evidence
          path: .local/story-screenshots
          if-no-files-found: ignore
          retention-days: 7
