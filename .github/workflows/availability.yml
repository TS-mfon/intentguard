name: IntentGuard 72-hour availability
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && vars.INTENTGUARD_AVAILABILITY_ENABLED == 'true'
    name: Probe ${{ matrix.runner.os }} / ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [testnet, mainnet]
        runner:
          - {os: ubuntu, label: ubuntu-24.04}
          - {os: windows, label: windows-2022}
          - {os: macos, label: macos-14}
    runs-on: ${{ matrix.runner.label }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with Linux libraries
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - name: Observe pinned live deployments
        env:
          INTENTGUARD_AVAILABILITY_CAMPAIGN: ${{ vars.INTENTGUARD_AVAILABILITY_CAMPAIGN }}
          INTENTGUARD_AVAILABILITY_CAMPAIGN_ID: ${{ vars.INTENTGUARD_AVAILABILITY_CAMPAIGN_ID }}
        run: node scripts/availability-probe.mjs - ${{ matrix.environment }} .local/availability
      - name: Preserve every observed slot, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: availability-${{ vars.INTENTGUARD_AVAILABILITY_CAMPAIGN_ID }}-${{ matrix.runner.os }}-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/availability/records.jsonl
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
